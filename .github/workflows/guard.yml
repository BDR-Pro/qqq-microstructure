# Part of qqq-microstructure.
#
# The SHADOW decision model (guard.py, RESULTS 27), decided every weekday well
# before the 15:50 ET MOC cutoff and committed so it can be graded honestly.
# It never trades and holds no secrets: no broker, no Telegram, no API key.
#
#   rule  -- the control: skip a name reporting before tomorrow's open, never
#            hedge (code only).
#   http  -- Tev1-4B, Together AI's open decision model, served by Ollama's
#            native Jev-compatible /v1/systemone on the runner's localhost.
#
# Both are pinned. Ollama is a released build checked against its published
# sha256; the model must carry the digest below. A different digest is a
# different decider, so the job refuses instead of silently pooling it into
# this one's record (a new decider starts its own 63-night record).
#
# When: GitHub starts scheduled jobs late. monthly.yml, set for 15:00 UTC,
# started 2h45m-6h45m late on every run in Sept-Oct 2026, so a midday
# decider would land after the 15:50 ET cutoff (guard.py refuses there) and
# lose the night. The state uses nothing from the decision day (yesterday's
# close and before, plus the earnings calendar), so deciding in the small
# hours loses nothing: 06:17 UTC is 02:17 EDT / 01:17 EST on the decision
# day itself, and even a 7-hour delay finishes before 10:00 ET. A missed run
# only shortens the record; it cannot bias it (it happens before the night).
# On a market holiday it still decides; the grader skips nights with no
# graded row.
name: guard
on:
  schedule:
    - cron: '17 6 * * 1-5'        # 02:17 EDT / 01:17 EST, the decision day
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: guard
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OLLAMA_VERSION: v0.40.3
      OLLAMA_SHA256: ce6f8b671a699bf1ebafb28d60dbbabf4f37b30b499145fa308a8ba72de021d6
      DECIDER_MODEL: tev1:4b-q4_K_M
      MODEL_DIGEST: 07be32e6e5e3dcc6b2deae7c68b89321e99daeedb08521e92771cc155473cbd9
      DECIDER_URL: http://127.0.0.1:11434/v1/systemone
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas yfinance lxml
      - name: the control (earnings rule)
        run: python src/guard.py --decide --backend rule
      - name: Ollama, pinned and verified, CPU only
        if: ${{ !cancelled() }}       # each decider runs even if the other failed
        run: |
          command -v zstd >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq zstd; }
          curl -fsSL -o "$RUNNER_TEMP/ollama.tar.zst" \
            "https://github.com/ollama/ollama/releases/download/$OLLAMA_VERSION/ollama-linux-amd64.tar.zst"
          echo "$OLLAMA_SHA256  $RUNNER_TEMP/ollama.tar.zst" | sha256sum -c -
          mkdir -p "$HOME/ollama"
          zstd -dc "$RUNNER_TEMP/ollama.tar.zst" | tar -xf - -C "$HOME/ollama" \
            --exclude='lib/ollama/cuda_*' --exclude='lib/ollama/vulkan*'
          rm "$RUNNER_TEMP/ollama.tar.zst"
          OLLAMA_HOST=127.0.0.1:11434 nohup "$HOME/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          timeout 120 bash -c 'until curl -sf 127.0.0.1:11434/api/version; do sleep 2; done'
          "$HOME/ollama/bin/ollama" pull "$DECIDER_MODEL"
          got=$(curl -sf 127.0.0.1:11434/api/tags | python -c "import sys, json; print({m['name']: m['digest'] for m in json.load(sys.stdin)['models']}.get('$DECIDER_MODEL'))")
          [ "$got" = "$MODEL_DIGEST" ] || { echo "::error::$DECIDER_MODEL digest $got is not the pinned $MODEL_DIGEST -- a changed decider is a new record (RESULTS 27); refusing"; exit 1; }
      - name: the decider (Tev1-4B)
        if: ${{ !cancelled() }}
        run: python src/guard.py --decide --backend http
      - name: commit the decisions before the close
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'qqq-guard[bot]'
          git config user.email 'actions@users.noreply.github.com'
          git add reports/guard_log.csv
          git diff --cached --quiet && exit 0
          git commit -m 'guard: decisions before the close (actions)'
          for i in 1 2 3 4; do
            git pull --rebase -q && git push -q && exit 0
            sleep $((2 ** i))
          done
          exit 1
