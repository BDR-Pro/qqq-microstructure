# Part of qqq-microstructure.
#
# The daily ROI telegram. This job never touches the broker -- it reconciles
# the fills the VM already pushed (reports/fills.csv) against the graded
# record and sends the scorecard. The division of labor, on the record:
#
#   VM (next to IB Gateway, localhost only -- see install_ibkr.sh):
#     registers/grades daily (xsec_live is idempotent -- it emits the basket
#     only on a new month, so the 1st is never missed), runs the order legs,
#     captures fills, pushes. The open leg liquidates EVERY held position,
#     basket or not, so a month rollover can never strand Aug-31 buys. Crontab:
#
#       CRON_TZ=America/New_York
#       0  8  * * 1-5  cd $HOME/qqq-microstructure && git pull -q && python3 src/xsec_live.py >> $HOME/qqq.log 2>&1; git add reports && { git diff --cached --quiet || { git commit -qm "register/grade" && git push -q; }; }
#       @reboot        cd $HOME/qqq-microstructure && nohup python3 src/jev_local.py --model Qwen/Qwen3.5-0.8B --port 8787 >> $HOME/jev_local.log 2>&1 &
#       15 15 * * 1-5  cd $HOME/qqq-microstructure && git pull -q && DECIDER_URL=http://127.0.0.1:8787/v1/systemone python3 src/guard.py --decide >> $HOME/qqq.log 2>&1; git add reports/guard_log.csv && { git diff --cached --quiet || { git commit -qm "guard: decisions before the close" && git push -q; }; }
#       25 15 * * 1-5  cd $HOME/qqq-microstructure && git pull -q && python3 src/orders.py --capital 25000 --leg close --submit >> $HOME/qqq.log 2>&1
#       10 16 * * 1-5  cd $HOME/qqq-microstructure && python3 src/fills.py >> $HOME/qqq.log 2>&1; git add reports && { git diff --cached --quiet || { git commit -qm "rehearsal fills" && git push -q; }; }
#       20 9  * * 1-5  cd $HOME/qqq-microstructure && git pull -q && python3 src/orders.py --capital 25000 --leg open --submit >> $HOME/qqq.log 2>&1
#       40 9  * * 1-5  cd $HOME/qqq-microstructure && python3 src/fills.py >> $HOME/qqq.log 2>&1; git add reports && { git diff --cached --quiet || { git commit -qm "rehearsal fills" && git push -q; }; }
#
#   The 15:15 line is the SHADOW decision model (guard.py, RESULTS 27): it
#   commits tonight's hold/hedge answers BEFORE the close so they can be graded
#   honestly; it never trades. The @reboot line keeps the local Jev-compatible
#   server (jev_local.py) up; for hosted Jev instead, set DECIDER_URL to
#   https://api.typesafe.ai/v1/systemone and DECIDER_KEY to your key.
#
#   Conflicts: both sides append to reports/*.csv and both push, so a same-day
#   content conflict in an append-only log is routine. Resolve it with
#   `python src/merge_daily.py` (unions the rows, keeps every graded night,
#   adopts either side's added columns) and then `git commit` -- never by
#   picking one side, which silently drops nights the forward record needs.
#
#   GitHub (this file): reads what the VM pushed, telegrams the running net.
#     15:00 UTC Tue-Sat covers Mon-Fri nights after the morning capture push.
#
# Secrets: TELEGRAM_API, TELEGRAM_CHAT. Never an IBKR anything -- the IB API
# socket is unauthenticated and must stay on the VM's localhost.
# Note: cron fires only from the DEFAULT branch.

name: roi
on:
  schedule:
    - cron: '0 15 * * 2-6'        # Tue-Sat 15:00 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  roi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet numpy pandas
      - name: reconcile and telegram
        env:
          TELEGRAM_API: ${{ secrets.TELEGRAM_API }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
        run: python src/fills.py --report
